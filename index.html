<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Burn Rate" />
    <meta name="theme-color" content="#0e0b0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf6f2" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burn Rate Meter</title>
    <meta name="description" content="How much money is this meeting burning right now? A live meeting cost meter." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ubongfx.github.io/burn-rate-meter/" />
    <meta property="og:title" content="Burn Rate Meter" />
    <meta property="og:description" content="How much money is this meeting burning right now?" />
    <meta property="og:image" content="https://ubongfx.github.io/burn-rate-meter/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Burn Rate Meter: €135 burned – that's 12 pizzas" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a flash (see src/lib/settings.ts).
      try {
        const theme = JSON.parse(localStorage.getItem('burn-rate-meter:settings'))?.settings?.theme
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
