<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Burn Rate" />
    <meta name="theme-color" content="#0e0b0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf6f2" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burn Rate Meter</title>
    <meta name="description" content="How much money is this meeting burning right now? A live meeting cost meter." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ubongfx.github.io/burn-rate-meter/" />
    <meta property="og:title" content="Burn Rate Meter" />
    <meta property="og:description" content="How much money is this meeting burning right now?" />
    <meta property="og:image" content="https://ubongfx.github.io/burn-rate-meter/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Burn Rate Meter: €135 burned – that's 12 pizzas" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a flash (see src/lib/settings.ts).
      try {
        const theme = JSON.parse(localStorage.getItem('burn-rate-meter:settings'))?.settings?.theme
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <style>
      /* Shown until the app's styles and script have loaded, so launching never
         flashes black or white. Colors mirror --bg in src/styles/tokens.css. */
      html {
        background: #0e0b0a;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme='dark']) {
          background: #fbf6f2;
        }
      }
      html[data-theme='light'] {
        background: #fbf6f2;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 72px;
        animation: splash-glow 1.2s ease-in-out infinite alternate;
      }
      @keyframes splash-glow {
        from {
          filter: drop-shadow(0 0 8px rgb(255 122 26 / 0.4));
        }
        to {
          filter: drop-shadow(0 0 28px rgb(255 122 26 / 0.9));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- React replaces the splash when the app starts -->
    <div id="root"><div class="splash" aria-hidden="true">🔥</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
