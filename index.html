<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burn Rate Meter</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash (see src/lib/settings.ts).
      try {
        const theme = JSON.parse(localStorage.getItem('burn-rate-meter:settings'))?.settings?.theme
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
